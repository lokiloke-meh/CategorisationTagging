    "user_input": "---\nTitle: Consultation on Board Lot Framework Enhancements in the Hong Kong Securities\n  Market\nSource_URL: https://www.hkex.com.hk/-/media/HKEX-Market/Services/Circulars-and-Notices/Participant-and-Members-Circulars/SEHK/2025/EPD_CE_001_25_e.pdf\nScraped_At: '2026-05-22T21:09:47.396160'\nDocument_Type: PDF Direct Link\nDownloaded_PDF_Paths:\n- pdf/Consultation_on_Board_Lot_Framework_Enhancements_in_the_Hong_Kong_Securities_Market.pdf\n---\n\n# Consultation on Board Lot Framework Enhancements in the Hong Kong Securities Market\n\n**Note:** This circular is a direct PDF document. - [View Local PDF](./pdf/Consultation_on_Board_Lot_Framework_Enhancements_in_the_Hong_Kong_Securities_Market.pdf)\n- [Original Link](https://www.hkex.com.hk/-/media/HKEX-Market/Services/Circulars-and-Notices/Participant-and-Members-Circulars/SEHK/2025/EPD_CE_001_25_e.pdf)\n\n---\n## PDF Content\n\n香 港 聯 合 交 易 所 有 限 公 司 \n(香港交易及結算所有限公司全資附屬公司) \nTHE STOCK EXCHANGE OF HONG KONG LIMITED \n(A wholly-owned subsidiary of Hong Kong Exchanges and Clearing Limited) \n通告  CIRCULAR \n \n \nSubject: Consultation on Board Lot Framework Enhancements in the  Hong Kong \nSecurities Market  \n \nEnquiry: –    Mr. Ryan Yeung (Tel: 2840 2362     E-mail: ryanyeung@hkex.com.hk) \n–    Mr. Victor Yip (Tel: 2840 3006     E-mail: victoryip@hkex.com.hk) \n \nHong Kong Exchanges and Clearing Limited (“HKEX”) has today (18 December 2025) published a \nconsultation paper on ‘Board Lot Framework Enhancements  in the Hong Kong Securities Market’  \n(“Consultation Paper”). HKEX is committed to continuously enhanc ing market structure, and in accordance with \nrecommendations made by the Hong Kong Special Administrative Region Government Task Force \non Enhancing Stock Market Liquidity , HKEX is proposing a new board lot framework  which seeks \nto enhance market competitiveness by improving market efficiency and accessibility. The proposed new board lot framework applies to equities 1 and Real Estate Investment Trusts \n(“REITs”), and comprises of the following three components:  \n \n1. Reduction of board lot value floor guidance from HK$2,000 to HK$1,000 \n2. Introduction of board lot value ceiling guidance at HK$50,000 \n3. Reduction of board lot units to a set of eight standardised options: 1, 50, 100, 500, 1,000, \n2,000, 5,000, and 10,000 shares \n \nThe Consultation P aper proposes a two-phase implementation  approach. In phase one, new \nissuers will be required to comply with all three components of the board lot framework upon listing, \nwhile existing issuers will only be required to comply with the board lot value floor and ceiling \nguidance. During phase two, each existing issuer will be required to adopt one of the standardised \n \n1 The following instruments are excluded from the scope of the proposal: Exchange Traded Products, \nStructured Products, debt securities, equity warrants, investment companies (listed under Chapter 21 of the \nListing Rules ), Nasdaq -Amex Pilot Program securities, Special Purpose Acquisition Company  shares and \nwarrants. 編號 \nRef. No.: EPD/CE/001/25 \n 日期 \nDate: 18/12/2025\n\n2 \nboard lot units within a specified period following its transition to uncertificated shareholding under \nthe Uncertificated Securities Market initiative. HKEX cordially invites market participants, including but not limited to Exchange Participants, listed \ncompanies, share registrars, broker system vendors, information vendors and investors, to provide \nfeedback on the proposal  by submitting a response to the questionnaire attached to the \nConsultation Paper published on the HKEX website . The consultation period will be closed on  12 \nMarch 2026 (Thursday). Nikki Falconar \nSenior Vice President \nEquities Product Development Department \nMarkets Division \n \nThis circular has been issued in the English language with a separate Chinese language \ntranslation. If there is any conflict in the circulars between the meaning of Chinese words or terms \nin the Chinese language version and English words in the English language version, the meaning \nof the English words shall prevail. ",

    "input_data": "Title: Consultation on Board Lot Framework Enhancements in the Hong Kong Securities Market. **Key Entities:**\n\n*   **Organization:** The Stock Exchange of Hong Kong Limited (HKEX)\n*   **Consultation Paper Subject:** Board Lot Framework Enhancements in the Hong Kong Securities Market\n*   **Enquiry Contacts:**\n    *   Mr. Ryan Yeung (Tel: 2840 2362, E-mail: ryanyeung@hkex.com.hk)\n    *   Mr. Victor Yip (Tel: 2840 3006, E-mail: victoryip@hkex.com.hk)\n\n**Key Information:**\n\n*   **Publication Date of Consultation Paper:** 18 December 2025\n*   **Purpose:** To propose a new board lot framework to enhance market competitiveness and efficiency in the Hong Kong Securities Market, following recommendations from the Hong Kong Special Administrative Region Government Task Force on Enhancing Stock Market Liquidity.\n*   **Scope of Application:** Equities 1 and Real Estate Investment Trusts (REITs).\n*   **Proposed Framework Components:**\n    1.  Reduction of board lot value floor guidance from HK$2,000 to HK$1,000.\n    2.  Introduction of board lot value ceiling guidance at HK$50,000.\n    3.  Reduction of board lot units to eight standardized options: 1, 50, 100, 500, 1,000, 2,000, 5,000, and 10,000 shares.\n*   **Implementation Phases:**\n    *   **Phase One:** New issuers must comply with all three components; existing issuers only need to comply with the board lot value floor and ceiling guidance.\n    *   **Phase Two:** Existing issuers will be required to adopt one of the standardized board lot units within a specified period after transitioning to uncertificated shareholding under the Uncertificated Securities Market initiative.\n*   **Consultation Period Closure:** 12 March 2026 (Thursday).\n\n**Exclusions from Proposal:** Exchange Traded Products, Structured Products, debt securities, equity warrants, investment companies (listed under Chapter 21 of the Listing Rules), Nasdaq -Amex Pilot Program securities, Special Purpose Acquisition Company shares and warrants.",
