    "user_input": "---\nTitle: HKEX Backbone Network Upgrade for Securities Market Systems - Market Rehearsals\n  Update\nSource_URL: https://www.hkex.com.hk/-/media/HKEX-Market/Services/Circulars-and-Notices/Participant-and-Members-Circulars/SEHK/2026/CT07226E.pdf\nScraped_At: '2026-05-22T21:11:22.909388'\nDocument_Type: PDF Direct Link\nDownloaded_PDF_Paths:\n- pdf/HKEX_Backbone_Network_Upgrade_for_Securities_Market_Systems_-_Market_Rehearsals_Update.pdf\n---\n\n# HKEX Backbone Network Upgrade for Securities Market Systems - Market Rehearsals Update\n\n**Note:** This circular is a direct PDF document.\n\n- [View Local PDF](./pdf/HKEX_Backbone_Network_Upgrade_for_Securities_Market_Systems_-_Market_Rehearsals_Update.pdf)\n- [Original Link](https://www.hkex.com.hk/-/media/HKEX-Market/Services/Circulars-and-Notices/Participant-and-Members-Circulars/SEHK/2026/CT07226E.pdf)\n\n---\n## PDF Content\n\n香 港 聯 合 交 易 所 有 限 公 司 \n(香港交易及結算所有限公司全資附屬公司) \nTHE STOCK EXCHANGE OF HONG KONG LIMITED \n(A wholly-owned subsidiary of Hong Kong Exchanges and Clearing Limited) \n通告  CIRCULAR \n \n \n \n \nWith reference to the Exchange Circulars (Ref. No.: CT/024/26 & CT/035/26), the first mandatory Market \nRehearsal ( MR1) for HKEX backbone network upgrade was completed successfully.  The second \nmandatory Market Rehearsal ( MR2) will be held on  30 May 2026 (Saturday ).  All E xchange \nParticipants (EPs) and China Connect Exchange Participants (CCEPs) are required to participate \nin MR2 and simulate daily operations on the upgraded HKEX backbone network.  EPs relying on \ninformation vendors to provide market data updates for trading purpose should liaise with their \nrespective information vendors for providing market data support during the MRs. \n \nSummary of the MRs: \nEvents Date Time Details \n[Completed] \nMandatory \nMR1 \n11 April 2026 \n(Saturday) \n09:00-13:15 The internal components of backbone \nnetwork at the HKEX primary site will be \nupgraded, while the external -facing \ncomponents will remain unchanged. \n \nMandatory \nMR2 \n30 May 2026 \n(Saturday) \n09:00-13:15 The entire backbone network at the \nHKEX primary site will be upgraded , \nwhile the network at the HKEX backup \nsite will remain unchanged. \n \nEPs and CCEPs should follow the \nactivity rundown (Attachment 1) to: \n• Submit orders to simulate normal \ndaily operations. \n \n1 All calls to and from the Participant General Enquiry Hotline may be recorded.   HKEX Privacy Policy Statement \nis available here. \nSubject: HKEX BACKBONE NETWORK UPGRADE FOR SECURITIES MARKET SYSTEMS \n– MARKET REHEARSALS UPDATE \nEnquiry: Participant General Enquiry Hotline1  (Tel: 2840 3626 E-mail: trd@hkex.com.hk) \n 編號 \nRef. No.: CT/072/26 \n 日期 \nDate: 19/05/2026\n\n2 \nEvents Date Time Details \n• Login to ECP via SFTP only to verify \nconnectivity, if applicable. \n \n \nUpon completion of MR2, further details on subsequent MRs and Post Release Tests for rollout will be \nannounced in due course.  Thank you in advance for your participation and co-operation. \n \n \n \nHerman Sin \nSenior Vice President \nTrading Department \nOperations Division \n \n \nThis circular has been issued in the English language with a separate Chinese language translation. If there is any conflict in the circulars \nbetween the meaning of Chinese words or terms in the Chinese language version and English words in the English lan guage version, the \nmeaning of the English words shall prevail.\n",

cing \ncomponents will remain unchanged. \n \nMandatory \nMR2 \n30 May 2026 \n(Saturday) \n09:00-13:15 The entire backbone network at the \nHKEX primary site will be upgraded , \nwhile the network at the HKEX backup \nsite will remain unchanged. \n \nEPs and CCEPs should follow the \nactivity rundown (Attachment 1) to: \n• Submit orders to simulate normal \ndaily operations. \n \n1 All calls to and from the Participant General Enquiry Hotline may be recorded.   HKEX Privacy Policy Statement \nis available here. \nSubject: HKEX BACKBONE NETWORK UPGRADE FOR SECURITIES MARKET SYSTEMS \n– MARKET REHEARSALS UPDATE \nEnquiry: Participant General Enquiry Hotline1  (Tel: 2840 3626 E-mail: trd@hkex.com.hk) \n 編號 \nRef. No.: CT/072/26 \n 日期 \nDate: 19/05/2026\n\n2 \nEvents Date Time Details \n• Login to ECP via SFTP only to verify \nconnectivity, if applicable. \n \n \nUpon completion of MR2, further details on subsequent MRs and Post Release Tests for rollout will be \nannounced in due course.  Thank you in advance for your participation and co-operation. \n \n \n \nHerman Sin \nSenior Vice President \nTrading Department \nOperations Division \n \n \nThis circular has been issued in the English language with a separate Chinese language translation. If there is any conflict in the circulars \nbetween the meaning of Chinese words or terms in the Chinese language version and English words in the English lan guage version, the \nmeaning of the English words shall prevail.\n",

cing \ncomponents will remain unchanged. \n \nMandatory \nMR2 \n30 May 2026 \n(Saturday) \n09:00-13:15 The entire backbone network at the \nHKEX primary site will be upgraded , \nwhile the network at the HKEX backup \nsite will remain unchanged. \n \nEPs and CCEPs should follow the \nactivity rundown (Attachment 1) to: \n• Submit orders to simulate normal \ndaily operations. \n \n1 All calls to and from the Participant General Enquiry Hotline may be recorded.   HKEX Privacy Policy Statement \nis available here. \nSubject: HKEX BACKBONE NETWORK UPGRADE FOR SECURITIES MARKET SYSTEMS \n– MARKET REHEARSALS UPDATE \nEnquiry: Participant General Enquiry Hotline1  (Tel: 2840 3626 E-mail: trd@hkex.com.hk) \n 編號 \nRef. No.: CT/072/26 \n 日期 \nDate: 19/05/2026\n\n2 \nEvents Date Time Details \n• Login to ECP via SFTP only to verify \nconnectivity, if applicable. \n \n \nUpon completion of MR2, further details on subsequent MRs and Post Release Tests for rollout will be \nannounced in due course.  Thank you in advance for your participation and co-operation. \n \n \n \nHerman Sin \nSenior Vice President \nTrading Department \nOperations Division \n \n \nThis circular has been issued in the English language with a separate Chinese language translation. If there is any conflict in the circulars \nbetween the meaning of Chinese words or terms in the Chinese language version and English words in the English lan guage version, the \nmeaning of the English words shall prevail.\n",

    "input_data": "---\nTitle: HKEX Backbone Network Upgrade for Securities Market Systems - Market Rehearsals\n  Update\nSource_URL: https://www.hkex.com.hk/-/media/HKEX-Market/Services/Circulars-and-Notices/Participant-and-Members-Circulars/SEHK/2026/CT07226E.pdf\nScraped_At: '2026-05-22T21:11:22.909388'\nDocument_Type: PDF Direct Link\nDownloaded_PDF_Paths:\n- pdf/HKEX_Backbone_Network_Upgrade_for_Securities_Market_Systems_-_Market_Rehearsals_Update.pdf\n---\n\n# HKEX Backbone Network Upgrade for Securities Market Systems - Market Rehearsals Update\n\n**Note:** This circular is a direct PDF document.\n\n- [View Local PDF](./pdf/HKEX_Backbone_Network_Upgrade_for_Securities_Market_Systems_-_Market_Rehearsals_Update.pdf)\n- [Original Link](https://www.hkex.com.hk/-/media/HKEX-Market/Services/Circulars-and-Notices/Participant-and-Members-Circulars/SEHK/2026/CT07226E.pdf)\n\n---\n## PDF Content\n\n香 港 聯 合 交 易 所 有 限 公 司 \n(香港交易及結算所有限公司全資附屬公司) \nTHE STOCK EXCHANGE OF HONG KONG LIMITED \n(A wholly-owned subsidiary of Hong Kong Exchanges and Clearing Limited) \n通告  CIRCULAR \n \n \n \n \nWith reference to the Exchange Circulars (Ref. No.: CT/024/26 & CT/035/26), the first mandatory Market \nRehearsal ( MR1) for HKEX backbone network upgrade was completed successfully.  The second \nmandatory Market Rehearsal ( MR2) will be held on  30 May 2026 (Saturday ).  All E xchange \nParticipants (EPs) and China Connect Exchange Participants (CCEPs) are required to participate \nin MR2 and simulate daily operations on the upgraded HKEX backbone network.  EPs relying on \ninformation vendors to provide market data updates for trading purpose should liaise with their \nrespective information vendors for providing market data support during the MRs. \n \nSummary of the MRs: \nEvents Date Time Details \n[Completed] \nMandatory \nMR1 \n11 April 2026 \n(Saturday) \n09:00-13:15 The internal components of backbone \nnetwork at the HKEX primary site will be \nupgraded, while the external -facing \ncomponents will remain unchanged. \n \nMandatory \nMR2 \n30 May 2026 \n(Saturday) \n09:00-13:15 The entire backbone network at the \nHKEX primary site will be upgraded , \nwhile the network at the HKEX backup \nsite will remain unchanged. \n \nEPs and CCEPs should follow the \nactivity rundown (Attachment 1) to: \n• Submit orders to simulate normal \ndaily operations. \n \n1 All calls to and from the Participant General Enquiry Hotline may be recorded.   HKEX Privacy Policy Statement \nis available here. \nSubject: HKEX BACKBONE NETWORK UPGRADE FOR SECURITIES MARKET SYSTEMS \n– MARKET REHEARSALS UPDATE \nEnquiry: Participant General Enquiry Hotline1  (Tel: 2840 3626 E-mail: trd@hkex.com.hk) \n 編號 \nRef. No.: CT/072/26 \n 日期 \nDate: 19/05/2026\n\n2 \nEvents Date Time Details \n• Login to ECP via SFTP only to verify \nconnectivity, if applicable. \n \n \nUpon completion of MR2, further details on subsequent MRs and Post Release Tests for rollout will be \nannounced in due course.  Thank you in advance for your participation and co-operation. \n \n \n \nHerman Sin \nSenior Vice President \nTrading Department \nOperations Division \n \n \nThis circular has been issued in the English language with a separate Chinese language translation. If there is any conflict in the circulars \nbetween the meaning of Chinese words or terms in the Chinese language version and English words in the English lan guage version, the \nmeaning of the English words shall prevail.\n",

            function attachListener() {
                const plotEl = document.getElementById('plotly-gantt');
                
                // Check if Plotly and the element are ready
                if (plotEl && plotEl.on) {
                    plotEl.on('plotly_click', function(data) {
                        const spanId = data.points[0].customdata[0];
                        const details = spanDetails[spanId];
                        const output = document.getElementById('details-output');
                        const instruction = document.getElementById('instruction-text');

                        if (details) {
                            output.textContent = JSON.stringify(details, null, 2);
                            instruction.textContent = "Viewing details for Span: " + spanId;
                        } else {
                            instruction.textContent = "Span ID: " + spanId + " (No file found)";
                        }
                    });
                } else {
                    setTimeout(attachListener, 100);
                }
            }
            attachListener();
